<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGI - home-v4.5</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #0b1f2e;
    }

    .hero video {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero .video-bg {
      position: absolute;
      top: 0;
      left: 0;
      filter: blur(10px) brightness(0.6);
      transform: scale(1.1);
    }

    .hero .video-main {
      position: relative;
    }

    .hero .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <section class="hero">
    <video class="video-bg" src="4.5/video.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
    <video class="video-main" src="4.5/video.mp4" autoplay muted loop playsinline></video>
    <img class="overlay" src="4.5/overlay.png" alt="">
  </section>

  <section class="second-fold">
    <img src="v3/second-fold-1.png" alt="Second Fold" style="width: 100%; display: block; height: auto;">
  </section>
  <script>
    document.querySelectorAll('video').forEach(video => {
      // Attempt to play the video explicitly
      let playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.error("Autoplay was prevented or video failed to load:", error);
        });
      }
    });
  </script>
</body>

</html>
