<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        #frame {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
        }
        #error {
            color: #fff;
            font-family: system-ui, sans-serif;
            padding: 40px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <img id="img" alt="" style="display: none;">
    <video id="vid" autoplay loop muted playsinline style="display: none; width: 100%; height: auto;"></video>
    <iframe id="frame"></iframe>
    <p id="error">Media not found.</p>

    <script>
        const slug = window.location.pathname.replace('/', '').trim();

        if (slug) {
            const extensions = ['png', 'jpg', 'jpeg', 'webp', 'mp4', 'html'];
            const img = document.getElementById('img');
            const vid = document.getElementById('vid');
            const frame = document.getElementById('frame');

            function tryNext(i) {
                if (i >= extensions.length) {
                    img.style.display = 'none';
                    vid.style.display = 'none';
                    frame.style.display = 'none';
                    document.getElementById('error').style.display = 'block';
                    return;
                }

                const ext = extensions[i];
                if (ext === 'html') {
                    fetch(`/${slug}.html`, { method: 'HEAD' })
                        .then(res => {
                            if (res.ok) {
                                document.title = slug;
                                frame.src = `/${slug}.html`;
                                frame.style.display = 'block';
                            } else {
                                tryNext(i + 1);
                            }
                        })
                        .catch(() => tryNext(i + 1));
                } else if (ext === 'mp4') {
                    vid.onloadeddata = () => {
                        document.title = slug;
                        vid.style.display = 'block';
                    };
                    vid.onerror = () => tryNext(i + 1);
                    vid.src = `/${slug}.${ext}`;
                } else {
                    const tempImg = new Image();
                    tempImg.onload = () => {
                        document.title = slug;
                        img.src = tempImg.src;
                        img.alt = slug;
                        img.style.display = 'block';
                    };
                    tempImg.onerror = () => tryNext(i + 1);
                    tempImg.src = `/${slug}.${ext}`;
                }
            }

            tryNext(0);
        }
    </script>
</body>
</html>
