<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGI - home-v4.1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  

  .slider { position: relative; width: 100%; height: auto; display: grid; overflow: hidden; }

  .slide {
    grid-area: 1 / 1;
    width: 100%; height: auto; display: block;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
    z-index: 0;
  }
  .slide:not(.active) { transition-delay: 1.2s; }
  .slide.active { opacity: 1; z-index: 1; transition-delay: 0s; }

  .dots {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 3;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff;
    background: transparent; cursor: pointer; padding: 0;
  }
  .dot.active { background: #fff; }
</style>
</head>
<body>
<div class="slider" id="slider">
  <img class="slide active" src="v1/IGI-frame-1.jpg" alt="Slide 1">
  <img class="slide" src="v1/IGI-frame-2.jpg" alt="Slide 2">
  <img class="slide" src="v1/IGI-frame-3.jpg" alt="Slide 3">

  <div class="dots"></div>
</div>

<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  const dotsEl = document.querySelector('.dots');
  const DELAY = 5000;
  let i = 0, timer;

  const dots = slides.map((_, n) => {
    const d = document.createElement('button');
    d.className = 'dot' + (n === 0 ? ' active' : '');
    d.setAttribute('aria-label', 'Slide ' + (n + 1));
    d.onclick = () => { go(n); restart(); };
    dotsEl.appendChild(d);
    return d;
  });

  function go(n) {
    slides[i].classList.remove('active');
    dots[i].classList.remove('active');
    i = (n + slides.length) % slides.length;
    slides[i].classList.add('active');
    dots[i].classList.add('active');
  }
  function restart() { clearInterval(timer); timer = setInterval(() => go(i + 1), DELAY); }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { go(i - 1); restart(); }
    if (e.key === 'ArrowRight') { go(i + 1); restart(); }
  });

  restart();
})();
</script>
</body>
</html>
